services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot-backend
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Dashboard Temps Réel
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: iot-dashboard
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Simulateur IoT (Original - UCI Dataset)
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: iot-simulator
    environment:
      - MQTT_BROKER=mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    profiles:
      - simulation  # Optionnel - activer avec --profile simulation

  # Pipeline Capteurs Industriels - Agrégateur principal
  sensor-aggregator:
    build:
      context: ./sensor_pipeline
      dockerfile: Dockerfile
    container_name: sensor-aggregator
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - AGGREGATION_TOLERANCE=1
      - SENSOR_COMPONENT=aggregator
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import paho.mqtt.client as mqtt; c = mqtt.Client(); c.connect('mosquitto', 1883, 10); c.disconnect()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Simulateur Capteurs Industriels Réels (Optionnel)
  sensor-simulator:
    build:
      context: ./sensor_pipeline
      dockerfile: Dockerfile
    container_name: sensor-simulator
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - SENSOR_COMPONENT=simulator
      - SENSOR_INTERVAL_SECONDS=30  # 30 secondes pour données continues
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - sensor-sim  # Optionnel - activer avec --profile sensor-sim
    healthcheck:
      test: ["CMD", "python", "-c", "import paho.mqtt.client as mqtt; c = mqtt.Client(); c.connect('mosquitto', 1883, 10); c.disconnect()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  data_volume: